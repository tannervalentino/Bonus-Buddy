<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Twitch Bonus Claimer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Twitch Bonus Claimer</h1>

  <div id="total-points">Total Points Claimed: 0</div>

  <div id="current-streamer-header">
    <img id="streamer-avatar" src="" alt="Avatar" />
    <div id="streamer-info">
      <h2 id="streamer-name">—</h2>
      <span id="streamer-points">0 pts</span>
      <span id="watch-time">Watched: 0h 0m</span>
    </div>
  </div>

  <div id="toolbar">
    <div id="toolbar-header">
      <h3>Claimed Channels</h3>
      <span id="toolbar-toggle">▶</span>
    </div>
    <ul id="channel-list" style="display: none;"></ul>
  </div>

  <div id="channel-details"></div>

  <script src="popup.js"></script>
</body>
</html>
